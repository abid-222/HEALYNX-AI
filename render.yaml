services:
  - type: web
    name: healynx-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: "cd apps/api && pip install -r requirements.txt"
    startCommand: "cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://healynx-ai.vercel.app,http://localhost:3000"
      - key: STORAGE_ALLOW_LOCAL
        value: "1"
      - key: EMAIL_PROVIDER
        value: none
      - key: STORAGE_BACKEND
        value: local
