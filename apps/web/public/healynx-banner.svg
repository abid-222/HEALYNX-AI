<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" style="background:#05080E; font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="50%" stop-color="#0B1322"/>
      <stop offset="100%" stop-color="#070C16"/>
    </linearGradient>

    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#banner-bg)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#10B981" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="220" r="180" fill="#06B6D4" fill-opacity="0.08" filter="blur(70px)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g stroke="#1F293D" stroke-width="0.8" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="850" y1="0" x2="850" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1150" y1="0" x2="1150" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Heartbeat ECG Vector Wave along bottom -->
  <path d="M 0 340 L 450 340 L 470 300 L 490 380 L 510 270 L 530 360 L 545 340 L 1200 340" fill="none" stroke="#10B981" stroke-width="2.5" opacity="0.4"/>
  <circle cx="510" cy="270" r="4" fill="#10B981" filter="url(#shadow-glow)"/>

  <!-- Left Main Emblem & Logo -->
  <g transform="translate(100, 100)">
    <!-- Logo Badge Box -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#neon-glow)" filter="url(#shadow-glow)"/>
    <path d="M 50 28 C 41 18 24 30 32 50 C 40 66 50 74 50 74 C 50 74 60 66 68 50 C 76 30 59 18 50 28 Z" fill="#05080E"/>
    <path d="M 40 50 L 46 50 L 49 44 L 52 56 L 55 48 L 57 50 L 60 50" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Brand Typography -->
    <text x="130" y="58" fill="#FFFFFF" font-size="54" font-weight="900" letter-spacing="-1">HEALYNX<tspan fill="#10B981">.AI</tspan></text>
    <text x="130" y="92" fill="#94A3B8" font-size="19" font-weight="600">Next-Gen Open Healthtech &amp; Clinical Intelligence Engine</text>

    <!-- Subtitle in Bengali & English -->
    <text x="130" y="130" fill="#CBD5E1" font-size="15" font-weight="500">🇧🇩 বাংলাদেশ হেলথ স্ট্যাক · AI Assists. Doctors Decide. Patients Control.</text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(770, 70)">
    <!-- Badge 1: BMDC Verified -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="5" fill="#10B981"/>
      <text x="32" y="23" fill="#10B981" font-size="12" font-weight="800">BMDC VERIFIED REGISTRY</text>
    </g>

    <!-- Badge 2: Dual Gate Safety -->
    <g transform="translate(195, 0)">
      <rect width="180" height="36" rx="18" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="5" fill="#06B6D4"/>
      <text x="32" y="23" fill="#06B6D4" font-size="12" font-weight="800">DUAL-GATE CLINICAL SAFETY</text>
    </g>
  </g>

  <!-- Engineering Attribution Pill -->
  <g transform="translate(100, 290)">
    <rect width="260" height="34" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="22" fill="#94A3B8" font-size="12" font-weight="600">ENGINEERED WITH PRIDE BY</text>
    <text x="185" y="22" fill="#38BDF8" font-size="13" font-weight="800">BYTEFORCE</text>
  </g>

  <g transform="translate(380, 290)">
    <rect width="210" height="34" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="22" fill="#94A3B8" font-size="12" font-weight="600">ARCHITECTURE</text>
    <text x="115" y="22" fill="#10B981" font-size="13" font-family="monospace" font-weight="800">v2.6.4-DHAKA</text>
  </g>

  <!-- Right Side Decorative Circuit Graphic -->
  <g transform="translate(900, 160)" opacity="0.85">
    <rect width="220" height="120" rx="16" fill="#0A101D" stroke="#1F293D" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94A3B8" font-size="12" font-weight="600">CLINICAL TELEMETRY</text>
    <text x="20" y="62" fill="#10B981" font-size="24" font-weight="900">104 / 104</text>
    <text x="20" y="85" fill="#64748B" font-size="11">Automated Clinical Tests</text>
    <text x="20" y="102" fill="#38BDF8" font-size="11" font-weight="700">100% PASS RATE 🟢</text>
  </g>
</svg>
